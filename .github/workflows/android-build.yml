name: Build Android

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'example/android/**'
      - 'nitrogen/generated/shared/**'
      - 'nitrogen/generated/android/**'
      - 'cpp/**'
      - 'android/**'
      - 'package-lock.json'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# munim-pencilkit is iOS-only (PencilKit has no Android counterpart). This
# job proves the package does not break an Android app: the example builds,
# links no native code from this package, and the JS API reports
# `isSupported() === false` / throws PencilKitUnsupportedError at runtime.
jobs:
  build:
    name: Build Android Example App (${{ matrix.arch }}, PencilKit unsupported)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [new]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Disable new architecture in gradle.properties
        if: matrix.arch == 'old'
        run: sed -i "s/newArchEnabled=true/newArchEnabled=false/g" example/android/gradle.properties

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Gradle build
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Stop Gradle daemon
        working-directory: example/android
        run: ./gradlew --stop
