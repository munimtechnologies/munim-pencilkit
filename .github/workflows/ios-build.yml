name: Build iOS

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-build.yml'
      - 'example/ios/**'
      - 'example/Gemfile'
      - 'example/Gemfile.lock'
      - '**/nitrogen/generated/shared/**'
      - '**/nitrogen/generated/ios/**'
      - 'cpp/**'
      - 'ios/**'
      - '**/Podfile.lock'
      - 'package-lock.json'
      - '**/*.podspec'
      - '**/react-native.config.js'
      - '**/nitro.json'
  pull_request:
  workflow_dispatch:

env:
  USE_CCACHE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Example App (Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # iOS 26 SDK: the iOS 27 APIs compile out (#if compiler(>=6.4)).
          - runner: macos-26
            xcode: '26.6'
          # iOS 27 SDK (GitHub's xcode-27 preview image).
          - runner: xcode-27
            xcode: '27.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby (bundle)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: example/ios

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/.cocoapods/repos
            example/ios/Pods
          # Local pods (React Native, this package) come from node_modules, so a
          # cached Pods/ is only valid for the same lockfiles; never restore a
          # Pods/ dir from another React Native version.
          key: ${{ runner.os }}-xcode${{ matrix.xcode }}-pods-${{ hashFiles('example/ios/Podfile.lock', 'package-lock.json', '*.podspec', 'nitrogen/generated/ios/*.rb') }}

      - name: Install Pods
        working-directory: example/ios
        # TEMP: Podfile.lock still pins RN 0.88.0; regenerate it here and commit the artifact.
        run: pod install || pod update --no-repo-update

      - name: Upload Podfile.lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Podfile.lock-xcode${{ matrix.xcode }}
          path: example/ios/Podfile.lock

      - name: Build App
        working-directory: example/ios
        run: |
          set -o pipefail && xcodebuild \
            CC=clang CPLUSPLUS=clang++ LD=clang LDPLUSPLUS=clang++ \
            -derivedDataPath build -UseModernBuildSystem=YES \
            -workspace MunimPencilkitExample.xcworkspace \
            -scheme MunimPencilkitExample \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO | xcpretty
